name: Build and deploy Node.js app to Azure Web App - rideshare-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          npm install --package-lock=false
        working-directory: frontend

      - name: Build app
        run: node node_modules/react-scripts/bin/react-scripts.js build
        working-directory: frontend

      - name: Prepare deployment package
        run: |
          New-Item -ItemType Directory -Path deploy -Force | Out-Null
          Copy-Item frontend/package.json deploy/package.json
          Copy-Item frontend/server.js deploy/server.js
          Copy-Item frontend/build deploy/build -Recurse

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F5B5F6E4742048B6AE55531FDED45190 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_20A4309FF67D4FC6BCEBB8609C3B1B1F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2D0F624E14AC478DA3DD2A1D2E5F017B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rideshare-frontend'
          slot-name: 'Production'
          package: .
